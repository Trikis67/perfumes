<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c1d19" />
    <title>Panel · Olorosos</title>
    <!-- Ícono temporal de la pestaña (Olorosos) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0b0c'/><text x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='42' font-style='italic' fill='%23d9b77a'>O</text><path d='M47 10c3 3.6 4.6 6.2 4.6 8.4a4.6 4.6 0 0 1-9.2 0c0-2.2 1.6-4.8 4.6-8.4Z' fill='%23d9b77a'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div id="app" class="app" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="confirm" id="confirm">
      <form method="dialog">
        <h2 id="confirmTitle"></h2>
        <p id="confirmText"></p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" value="cancel">Cancelar</button>
          <button class="btn btn-primary" value="ok" id="confirmOk"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
