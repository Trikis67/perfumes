<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c1d19" />
    <title>Panel · Ánima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div id="app" class="app" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="confirm" id="confirm">
      <form method="dialog">
        <h2 id="confirmTitle"></h2>
        <p id="confirmText"></p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" value="cancel">Cancelar</button>
          <button class="btn btn-primary" value="ok" id="confirmOk"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
