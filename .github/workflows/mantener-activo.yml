# Supabase pausa los proyectos gratis que pasan 7 días sin actividad.
# Esta tarea gratis de GitHub consulta el catálogo cada 3 días para que eso no pase.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar el catálogo
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" src/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" src/config.js)
          curl -fsS "$URL/rest/v1/settings?select=key" -H "apikey: $KEY" > /dev/null
          echo "Supabase respondió bien."
